name: Storigen Systems
description: >-
  Storigen Systems was an Internet infrastructure company founded in 2000 and based in
  Lowell, Massachusetts, that pioneered the Distributed Storage Network — a class of
  infrastructure intended to improve the economics and performance of bandwidth-intensive
  applications by enabling efficient storage, delivery, and management of data across
  distributed environments. The company raised roughly $49M from investors including
  Battery Ventures, Charles River Ventures (CRV), Flagship Pioneering, and Pilot House
  Ventures before ceasing operations; it is now permanently closed. It was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network as a stub.
  Enrichment found no live domain, developer portal, documentation, or API surface — the
  company is defunct and publishes nothing to harvest.
